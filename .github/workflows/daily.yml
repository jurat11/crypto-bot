name: daily-paper-trade
on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC, right after the daily candle closes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper trade one step
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py
      - name: Save state and logs
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add data/state.json logs MEMORY.md learnings.md
          git commit -m "paper run $(date -u +%F)" || echo "nothing to commit"
          git push
